[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "medinotes-pro-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "motor>=3.6,<4",
  "pymongo>=4.9,<5",
  "pydantic-settings>=2.6,<3",
  "PyJWT[crypto]>=2.9,<3",
  "anthropic>=0.40,<1",
  "PyMuPDF>=1.24,<2",
  "pytesseract>=0.3.13,<1",
  "Pillow>=11,<12",
  "boto3>=1.35,<2",
  "slowapi>=0.1.9,<1",
  "python-multipart>=0.0.17,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "httpx>=0.27,<1",
  "mongomock-motor>=0.0.35,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
